apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard-web
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.localdev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard-web
                port:
                  number: 80

