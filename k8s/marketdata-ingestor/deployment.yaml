apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ingestor
  labels:
    app: marketdata-ingestor
spec:
  # Default: 1 pod (no symbol duplication).
  # Scale up to process more symbols in parallel — each pod
  # automatically receives its own subset via SymbolPartitioner.
  # Keep replicas <= number of symbols (15 max for current config).
  replicas: 1
  serviceName: ingestor-headless   # must match the headless Service below
  selector:
    matchLabels:
      app: marketdata-ingestor
  template:
    metadata:
      labels:
        app: marketdata-ingestor
    spec:
      containers:
        - name: marketdata-ingestor
          image: trading/marketdata-ingestor:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: marketdata-ingestor-config
          env:
            # Downward API: injects the pod's own name (e.g. "ingestor-0").
            # SymbolPartitioner extracts the ordinal index from this value.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Must match spec.replicas above so each pod knows the total.
            # Update this value whenever you change replicas.
            - name: TOTAL_PODS
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
